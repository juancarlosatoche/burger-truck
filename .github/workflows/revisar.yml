# Revisa en cada pull request: los scripts de Blender usan lib_blender.py, y docs/MAPA.md sigue al día con index.html
name: Revisar
on:
  pull_request:
    paths: ['source/blender/**', 'index.html', 'docs/MAPA.md', 'tools/revisar_*.py']
  push:
    branches: [main]
    paths: ['source/blender/**', 'index.html', 'docs/MAPA.md', 'tools/revisar_*.py']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/revisar_blender.py
      - run: python3 tools/revisar_mapa.py
